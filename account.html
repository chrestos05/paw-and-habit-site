<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account — Paw &amp; Habit</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main><section class="auth-shell"><div class="auth-card"><div class="eyebrow">Your Paw &amp; Habit account</div><h1 id="account-title">Your space.</h1><p id="account-copy">Your account area will hold saved guides and future resources.</p><div id="account-status" class="status">Authentication setup is not active yet.</div><div class="actions"><a class="button" href="shop.html">Explore the shop</a><button id="logout" class="button alt">Sign out</button></div></div></section></main><div id="site-footer"></div><script src="site.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script>const cfg=window.PAW_AUTH_CONFIG||{};const ready=cfg.supabaseUrl&&!cfg.supabaseUrl.startsWith('YOUR_')&&cfg.supabaseAnonKey&&!cfg.supabaseAnonKey.startsWith('YOUR_');(async()=>{if(!ready)return;if(window.supabase){const c=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data}=await c.auth.getSession();if(!data.session){location.href='login.html';return}document.querySelector('#account-status').textContent='Signed in as '+data.session.user.email;document.querySelector('#logout').onclick=async()=>{await c.auth.signOut();location.href='login.html'}}})();</script></body></html>
